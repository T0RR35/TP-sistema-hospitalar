<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profissionais</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-sem-texto.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/profissionais.css}">
</head>

<body>
    <div class="layout-wrapper">
        <nav th:replace="~{fragments/nav}"></nav>

        <div class="main">
            <header th:replace="~{fragments/header}"></header>

            <div class="acoes-profissionais">
                <div class="filtros-profissionais">
                    <input type="text" id="filtro-nome" name="filtro-nome" placeholder="Buscar por nome">
                    <input type="text" id="filtro-registro" name="filtro-registro" placeholder="Buscar por registro">
                    <button type="button" class="btn-filtrar">Filtrar</button>
                </div>
                <div id="botoes">
                    <button type="button" id="btn-novo-profissional" class="btn-novo-profissional">Novo Profissional</button>
                    <button type="button" id="btn-nova-consulta" class="btn-novo-profissional">Nova Consulta</button>
                </div>
            </div>

            <section id="profissionais-container">
                <div id="listagem-profissionais">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Registro</th>
                                <th>Especialidade</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Dr. João</td>
                                <td>CRM 12345</td>
                                <td>Cardiologia</td>
                                <td>Ver | Editar</td>
                            </tr>
                            <tr>
                                <td>Dra. Ana</td>
                                <td>CRM 54321</td>
                                <td>Neurologia</td>
                                <td>Ver | Editar</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal de Cadastro de Profissional -->
    <div id="modal-cadastro-profissional" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2>Cadastro de Profissional</h2>
                <button type="button" id="btn-fechar-modal-profissional" class="btn-fechar-modal">&times;</button>
            </div>
            <form th:action="@{/}" method="get" class="form-cadastro-modal">
                <input type="text" id="nome" name="nome" placeholder="Nome" required>
                <input type="text" id="registro" name="registro" placeholder="Registro" required>
                <input type="text" id="especialidade" name="especialidade" placeholder="Especialidade" required>
                <input type="text" id="telefone" name="telefone" placeholder="Telefone" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <div class="modal-botoes">
                    <button type="button" id="btn-cancelar-modal-profissional" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Cadastro de Consulta -->
    <div id="modal-cadastro-consulta" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2>Cadastro de Consulta</h2>
                <button type="button" id="btn-fechar-modal-consulta" class="btn-fechar-modal">&times;</button>
            </div>
            <form th:action="@{/}" method="get" class="form-cadastro-modal">
                <input type="text" id="nomeProfissional" name="nomeProfissional" placeholder="nome Profissional" required>
                <input type="text" id="nomePaciente" name="nomePaciente" placeholder="nome Paciente" required>
                <input type="text" id="obs" name="obs" placeholder="observacoes" required>
                <input type="datetime-local" id="horario" name="horario" placeholder="" required>
                <input type="text" id="motivo" name="motivo" placeholder="motivo" required>
                <div class="modal-botoes">
                    <button type="button" id="btn-cancelar-modal-consulta" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/profissionais.js}"></script>
</body>

</html>
