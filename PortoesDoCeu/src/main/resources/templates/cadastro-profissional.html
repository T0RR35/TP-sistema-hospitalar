<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro Profissional</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-sem-texto.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
</head>

<body>
<header th:replace="~{fragments/header}"></header>

<div class="cadastro-container">

    <div class="logo-cadastro-container">
        <img th:src="@{/images/logo.jpeg}" alt="Logo" class="logo-cadastro">
    </div>

    <div classs="form-cadastro-container">
        <form th:action="@{/}" method="get" class="form-cadastro">
            <h2>Cadastro de Profissional</h2>
            <input type="text" id="nome" name="nome" placeholder="Nome" required>
            <input type="text" id="registro" name="registro" placeholder="Registro" required>
            <input type="text" id="especialidade" name="especialidade" placeholder="Especialidade" required>
            <input type="text" id="telefone" name="telefone" placeholder="Telefone" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <div class="btn-cadastro-container">
                <button type="submit">Cadastrar</button>
            </div>
            <div class="btn-voltar-container">
                <button type="button" onclick="window.location.href='/'">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
</body>
<script th:src="@{/js/login.js}"></script>

</html>
