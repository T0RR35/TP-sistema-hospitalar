<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-sem-texto.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pacientes.css}">
</head>

<body>
    <div class="layout-wrapper">
        <nav th:replace="~{fragments/nav}"></nav>

        <div class="main">
            <header th:replace="~{fragments/header}"></header>

            <div class="acoes-pacientes">
                <div class="filtros-pacientes">
                    <input type="text" id="filtro-nome" name="filtro-nome" placeholder="Buscar por nome">
                    <input type="text" id="filtro-cpf" name="filtro-cpf" placeholder="Buscar por CPF">
                    <button type="button" class="btn-filtrar">Filtrar</button>
                </div>
                <button type="button" id="btn-novo-paciente" class="btn-novo-paciente">Novo Paciente</button>
            </div>

            <section id="pacientes-container">
                <div id="listagem-pacientes">
                    <table>
                        <thead>
                            <tr>
                                <th>CPF</th>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>123.456.789.10</td>
                                <td>Bruno</td>
                                <td>3191234-5678</td>
                                <td>Ver | Editar</td>
                            </tr>
                            <tr>
                                <td>987.654.321.00</td>
                                <td>Maria</td>
                                <td>3198765-4321</td>
                                <td>Ver | Editar</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>

    <!-- Modal de Cadastro de Paciente -->
    <div id="modal-cadastro-paciente" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2>Cadastro de Paciente</h2>
                <button type="button" id="btn-fechar-modal" class="btn-fechar-modal">&times;</button>
            </div>
            <form th:action="@{/}" method="get" class="form-cadastro-modal">
                <input type="text" id="nome" name="nome" placeholder="Nome" required>
                <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                <input type="date" id="dataNascimento" name="dataNascimento" placeholder="Data de Nascimento" required>
                <input type="text" id="telefone" name="telefone" placeholder="Telefone" required>
                <input type="text" id="endereco" name="endereco" placeholder="Endereço" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <div class="modal-botoes">
                    <button type="button" id="btn-cancelar-modal" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/header.js}"></script>
    <script th:src="@{/js/pacientes.js}"></script>
</body>

</html>
